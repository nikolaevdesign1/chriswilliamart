<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chris Williams Art Gallery — List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav">
        <a class="site-nav__link is-active" href="/">gallery area</a>
        <a class="site-nav__link" href="/about.html">about</a>
        <a class="site-nav__link" href="/contacts.html">contacts</a>
      </nav>
      <p class="site-logo">
        <span>Chris Williams</span>
        <span>Art gallery</span>
      </p>
    </header>

    <div class="list-panel">
      <div class="list-panel__head">
        <span>number</span>
        <span>project</span>
        <span>artist</span>
      </div>
      <ul class="list-panel__rows"></ul>
    </div>

    <figure class="list-preview"><img alt="" /></figure>

    <aside class="artist-panel" hidden>
      <button class="artist-panel__close" type="button" aria-label="Close">×</button>
      <h2 class="artist-panel__name"></h2>
      <p class="artist-panel__bio"></p>
      <div class="artist-panel__strip">
        <div class="artist-panel__track"></div>
      </div>
    </aside>

    <footer class="site-footer">
      <p class="site-footer__credit">created by <a href="https://nklvdsgn.com">nklvdsgn.com</a></p>
      <div class="view-toggle">
        <a class="view-toggle__btn" href="/">Field</a>
        <a class="view-toggle__btn is-active" href="/list.html">List</a>
      </div>
      <p class="site-footer__rights">all rights reserved 2026</p>
    </footer>

    <script type="module" src="/src/list.js"></script>
  </body>
</html>
