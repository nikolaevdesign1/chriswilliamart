<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chris Williams Art Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="preloader" class="preloader">
      <div class="preloader__scatter"></div>
      <div class="preloader__bar"><div class="preloader__bar-fill"></div></div>
      <p class="preloader__percent">0%</p>
    </div>

    <header class="site-header">
      <nav class="site-nav">
        <a class="site-nav__link is-active" href="/" data-nav-field>gallery area</a>
        <a class="site-nav__link" href="/about.html">about</a>
        <a class="site-nav__link" href="/contacts.html">contacts</a>
      </nav>
      <p class="site-logo">
        <span>Chris Williams</span>
        <span>Art gallery</span>
      </p>
    </header>

    <main>
      <div id="view-field" class="field grid-texture">
        <div class="field-world"></div>
      </div>
      <div id="view-work" class="grid-texture" data-cursor-label="back to gallery" hidden></div>
      <div id="view-list" class="list-view" hidden>
        <div class="list-panel">
          <div class="list-panel__head">
            <span>number</span>
            <span>project</span>
            <span>artist</span>
          </div>
          <ul class="list-panel__rows"></ul>
        </div>

        <div class="list-showcase">
          <div class="list-showcase__header">
            <h2 class="list-showcase__name"></h2>
            <p class="list-showcase__bio"></p>
          </div>
          <div class="list-showcase__strip">
            <div class="list-showcase__track"></div>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <p class="site-footer__credit">created by <a href="https://nklvdsgn.com">nklvdsgn.com</a></p>
      <div class="view-toggle">
        <a class="view-toggle__btn is-active" href="/" data-nav-field>Field</a>
        <a class="view-toggle__btn" href="/list" data-nav-list>List</a>
      </div>
      <p class="site-footer__rights">all rights reserved 2026</p>
    </footer>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
