<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chris Williams Art Gallery | Paintings, one artist at a time</title>
    <meta name="description" content="A single room in East London showing one painter at a time since 2009. Wander seven artists' work online, or visit us Wednesday to Sunday." />
    <meta name="theme-color" content="#f4f5f5" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (messengers, social). og:image should be an absolute URL
         once the site has a domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chris Williams Art Gallery" />
    <meta property="og:title" content="Chris Williams Art Gallery" />
    <meta property="og:description" content="A single room in East London showing one painter at a time since 2009. Wander seven artists' work online, or visit us Wednesday to Sunday." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chris Williams Art Gallery" />
    <meta name="twitter:description" content="A single room in East London showing one painter at a time since 2009. Wander seven artists' work online, or visit us Wednesday to Sunday." />
    <meta name="twitter:image" content="/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint: the page renders in the
         fallback face straight away and swaps to Google Sans Flex on arrival. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <main class="stage">
      <p class="welcome-copy">
        <span>Welcome to Chris Williams</span><br />
        <span>Art Gallery</span>
      </p>

      <figure class="scatter" style="--x:613;--y:384.79;--w:82.06;--h:102.68">
        <span class="scatter__inner" style="--iw:59;--ih:89.6;--r:-16.53deg">
          <img src="/src/assets/img/welcome/scatter-01.png" alt="" />
        </span>
      </figure>
      <figure class="scatter" style="--x:1025.25;--y:325.4;--w:88.5;--h:67.2">
        <span class="scatter__inner" style="--iw:88.5;--ih:67.2;--r:0deg">
          <img src="/src/assets/img/welcome/scatter-02.png" alt="" />
        </span>
      </figure>
      <figure class="scatter" style="--x:1275.5;--y:513;--w:117.54;--h:151.4">
        <span class="scatter__inner" style="--iw:88.5;--ih:134.4;--r:13.56deg">
          <img src="/src/assets/img/welcome/scatter-03.png" alt="" />
        </span>
      </figure>
      <figure class="scatter" style="--x:699;--y:663.93;--w:100.28;--h:83.73">
        <span class="scatter__inner" style="--iw:88.5;--ih:67.2;--r:-11.69deg">
          <img src="/src/assets/img/welcome/scatter-04.png" alt="" />
        </span>
      </figure>
      <figure class="scatter" style="--x:971;--y:697.48;--w:102.38;--h:143.1">
        <span class="scatter__inner" style="--iw:88.5;--ih:134.4;--r:-6.15deg">
          <img src="/src/assets/img/welcome/scatter-05.png" alt="" />
        </span>
      </figure>
      <figure class="scatter" style="--x:553.08;--y:500.38;--w:132.03;--h:157.64">
        <span class="scatter__inner" style="--iw:88.5;--ih:134.4;--r:21.77deg">
          <img src="/src/assets/img/welcome/scatter-06.png" alt="" />
        </span>
      </figure>

      <a class="welcome-enter" href="/" aria-label="Enter gallery"></a>
    </main>

    <script type="module" src="/src/welcome.js"></script>
  </body>
</html>
